<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koor Cha Noor MIS</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#0B3B8C;
    color:white;
    z-index:9999;
}

#loading h2{
    margin-top:20px;
    font-weight:600;
}

.loader{
    margin-top:20px;
    width:45px;
    height:45px;
    border:5px solid rgba(255,255,255,.3);
    border-top:5px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

iframe{
    width:100%;
    height:100%;
    border:none;
    display:none;
}
</style>

</head>

<body>

<div id="loading">

<img src="assets/images/logo.png" width="120">

<h2>Koor Cha Noor MIS</h2>

<div class="loader"></div>

</div>

<iframe id="app"></iframe>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyYRag4Tl67K2AqqCilL4xfEtWOjtrgeI0Umq-TPc7AKyFoDZuXzvMyxvYDUUB-SXj_pw/exec";

const app=document.getElementById("app");

app.src=SCRIPT_URL;

app.onload=function(){

document.getElementById("loading").style.display="none";

app.style.display="block";

};

</script>

</body>
</html>
